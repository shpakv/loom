# Loom framework config — single source of truth for paths and phases
loom_version: 0.27.2   # written by /loom:init from the installed plugin package
version: 0.13
scripts_version: 0.16.0   # written by /loom:init; compared with shipped scripts version
paths:
  product: docs/product
  domain: docs/domain
  adr: docs/adr
  spikes: docs/spikes
  changes: docs/changes
  architecture: docs/architecture
  conventions: docs/conventions
  roadmap: docs/roadmap
  epics: docs/roadmap/epics
  scripts: scripts/loom
statuses:
  documents: [draft, in-review, approved, superseded]
  adr: [proposed, accepted, rejected, deprecated, superseded]
  changes: [captured, triaged, accepted, in-progress, applied, rejected, superseded]
naming: slug-based, no sequential numbers — see loom-core skill
phases:
  implemented: [imagine, roadmap, requirements, architecture, technology, consolidate, design, review, spike, audit, intake]
decisions:
  two_way: delegated
  one_way: recommend
  irreversible: confirm
