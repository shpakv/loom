name: validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/loom/*.py
      - run: python -m json.tool plugin.json >/dev/null
      - run: python -m json.tool .codex-plugin/plugin.json >/dev/null
      - run: python -m json.tool .claude-plugin/plugin.json >/dev/null
      - run: python -m json.tool .claude-plugin/marketplace.json >/dev/null
      - run: python -m json.tool .github/plugin/marketplace.json >/dev/null
